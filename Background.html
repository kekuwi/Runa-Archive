<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Runa's Archive - Background</title>

    <link rel="stylesheet" href="Assets/CSS/reset.css">
    <link rel="stylesheet" href="Assets/CSS/navbar-footer.css">
    <link rel="stylesheet" href="Assets/CSS/2D.css">

    <script src="https://kit.fontawesome.com/d14c9cf822.js" crossorigin="anonymous"></script>

    <link rel="apple-touch-icon" sizes="180x180" href="Assets/favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="Assets/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="Assets/favicon/favicon-16x16.png">
    <link rel="manifest" href="Assets/favicon/site.webmanifest">
    
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-BLTHBY6S85"></script>
    <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-BLTHBY6S85');
    </script>
</head>
<body>
    <script src="Assets/JS/navbar.js"></script>
    <script src="Assets/JS/dark-mode.js"></script>
    <script src="Assets/JS/category.js"></script>

    <section class="flex flex-center">
        <div class="main flex flex-center flex-column">
            <div class="category">
                <div onclick="categoryDropDown()" class="category-button flex flex-row flex-space">
                    <h2>Category</h2>
                    <i class="fa-solid fa-chevron-down"></i>
                </div>
                <div id="categoryDropDown" class="category-list">
                    <a onclick="location.href='./2D'" class="category-item">2D</a>
                    <a onclick="location.href='./3D'" class="category-item">3D</a>
                    <a onclick="location.href='./Assets'" class="category-item">Assets</a>
                    <a onclick="location.href='./Background'" class="category-item">Background</a>
                </div>
            </div>
            <div class="filter flex flex-row flex-left">
                <h3 class="filter-text" onclick="filterPopUp()" style="cursor: pointer;">Filters: </h3>
                <p id="selected-filter"></p>
                <div class="filter-popup hide" id="filter-popup">
                    <div class="filter-overlay" onclick="filterPopUp()"></div>
                    <div class="filter-list flex flex-column" id="filter-list">
                    </div>
                </div>
            </div>
            <hr>
            <div class="list flex flex-row" id="list"></div>
        </div>
    </section>

    <footer class="flex">
        <div class="flex flex-row" id="footer">
            <script src="Assets/JS/footer.js"></script>
        </div>
    </footer>
    
    <script src="Assets/JS/filter.js"></script>
    <script src="Assets/JS/List.js"></script>
    <script>createList('https://raw.githubusercontent.com/kekuwi/RA-Edit/main/Background.json')</script>
</body>
</html>
